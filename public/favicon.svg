<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Franco Sanchez">
  <!-- FS monogram. Replaces the Vite scaffold logo: the tab mark is the brand, not the
       build tool. Violet is the site accent (#6D28D9); geometry is drawn as paths so it
       stays crisp at 16px with no font dependency. -->
  <rect width="32" height="32" rx="7" fill="#6D28D9"/>
  <!-- F: stem + two arms, square-cut to match the editorial grid -->
  <path fill="#fff" d="M4 7h10v3.5H4zM4 7h3.5v18H4zM4 14.25h7.5v3.5H4z"/>
  <!-- S: single stroked centerline, same weight as the F stems -->
  <path fill="none" stroke="#fff" stroke-width="3.5"
        d="M26.25 10.2Q26.25 8.75 23 8.75Q19.75 8.75 19.75 12.4Q19.75 16 23 16Q26.25 16 26.25 19.6Q26.25 23.25 23 23.25Q19.75 23.25 19.75 21.8"/>
</svg>
